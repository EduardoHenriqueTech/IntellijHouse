# Sobe o sistema inteiro (banco + Python + Node) com UM comando:
#     docker compose up --build
# Depois abra http://localhost:3000   (admin: /#/admin · API: /docs)
#
# Antes, defina as senhas (crie um arquivo .env ao lado deste, ou exporte no terminal):
#     DB_PASSWORD=uma_senha_forte
#     ADMIN_TOKEN=outro_segredo
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      POSTGRES_DB: intellij_house
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intellij_house"]
      interval: 5s
      timeout: 5s
      retries: 10

  nlu:
    build: ./nlu-service
    restart: unless-stopped

  backend:
    build:
      context: .                      # raiz: a imagem inclui o front-end React
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      nlu:
        condition: service_started
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: intellij_house
      NLU_URL: http://nlu:5001
      ADMIN_TOKEN: ${ADMIN_TOKEN:?defina ADMIN_TOKEN}
    ports:
      - "3000:3000"

volumes:
  dados-postgres:
